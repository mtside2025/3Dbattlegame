<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Blade Arena</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="hud">
        <div class="status-card">
          <span class="status-label">PLAYER</span>
          <div class="bar-track"><div id="player-health" class="bar-fill player-fill"></div></div>
        </div>
        <div class="status-card">
          <span class="status-label">BOSS</span>
          <div class="bar-track"><div id="enemy-health" class="bar-fill enemy-fill"></div></div>
        </div>
      </div>

      <div id="message" class="message"></div>

      <section id="start-screen" class="overlay">
        <div class="panel">
          <p class="eyebrow">3D BATTLE GAME</p>
          <h1>Neon Blade Arena</h1>
          <p class="lead">
            光の剣で敵を撃破する、かんたん操作の3Dバトルゲームです。
            スタート前に操作を確認して、そのまま戦闘へ飛び込みましょう。
          </p>

          <div class="instructions">
            <div>
              <h2>操作方法</h2>
              <ul>
                <li><strong>W / A / S / D</strong> または <strong>↑ ← ↓ →</strong>：移動</li>
                <li><strong>Space</strong>：近距離斬撃</li>
                <li>敵に近づいてタイミングよく斬ると大ダメージ</li>
              </ul>
            </div>
            <div>
              <h2>ゲームの流れ</h2>
              <ul>
                <li>敵のHPを0にすると勝利</li>
                <li>プレイヤーHPが0になると敗北</li>
                <li>回り込んで攻撃すると被弾を避けやすい</li>
              </ul>
            </div>
          </div>

          <button id="start-button" class="start-button">ゲームスタート</button>
        </div>
      </section>
    </div>
  </body>
</html>
